server:
  port: 8090

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    # 使用专用业务账号，避免依赖 postgres 超级用户（曾被改 NOLOGIN 导致启动失败）
    username: airag
    password: airag123
    url: jdbc:postgresql://117.72.123.254:15432/ai-rag-knowledge
    type: com.zaxxer.hikari.HikariDataSource
    # hikari连接池配置
    hikari:
      #连接池名
      pool-name: HikariCP
      #最小空闲连接数
      minimum-idle: 5
      # 空闲连接存活最大时间，默认10分钟
      idle-timeout: 600000
      # 连接池最大连接数，默认是10
      maximum-pool-size: 10
      # 定期对池内空闲连接发送探活查询(SELECT 1)，防止长任务期间连接被防火墙/NAT 掐断
      keepalive-time: 30000
      # 此属性控制从池返回的连接的默认自动提交行为,默认值：true
      auto-commit: true
      # 此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认30分钟
      max-lifetime: 1800000
      # 数据库连接超时时间,默认30秒
      connection-timeout: 30000
      # 连接测试query
      connection-test-query: SELECT 1
  ai:
    ollama:
      base-url: http://117.72.123.254:11434
      embedding:
        options:
          num-batch: 512
        model: nomic-embed-text

# Redis
redis:
  sdk:
    config:
      host: 117.72.123.254
      port: 16379
      pool-size: 10
      min-idle-size: 5
      idle-timeout: 30000
      connect-timeout: 5000
      retry-attempts: 3
      retry-interval: 1000
      ping-interval: 60000
      keep-alive: true

logging:
  level:
    root: info
  config: classpath:logback-spring.xml
