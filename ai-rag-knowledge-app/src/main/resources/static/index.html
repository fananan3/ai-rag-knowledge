<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 知识库对话助手</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: #f7f9fc; }
    .chat-scroll::-webkit-scrollbar { width: 6px; }
    .chat-scroll::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
    .chat-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .chat-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .streaming-cursor::after {
      content: '▍'; display: inline-block; margin-left: 2px;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  </style>
</head>
<body class="h-screen flex items-center justify-center p-4">

<div class="w-full max-w-6xl h-[90vh] flex gap-4">

  <!-- ================= 左侧：知识库管理 (纯原生 JS 实现) ================= -->
  <div class="w-80 bg-white rounded-2xl shadow-xl flex flex-col overflow-hidden border border-gray-100">
    <header class="px-5 py-4 border-b border-gray-100 bg-white/80">
      <h2 class="text-base font-semibold text-gray-800 flex items-center gap-2">
        <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
        知识库管理
      </h2>
    </header>

    <div class="p-5 flex-1 overflow-y-auto chat-scroll">
      <!-- 标签输入 -->
      <div class="mb-5">
        <label class="block text-sm font-medium text-gray-700 mb-2">知识库标签</label>
        <input id="tagInput" list="tag-list" type="text" placeholder="选择或输入新标签"
               class="w-full rounded-xl border border-gray-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-400 transition-all bg-gray-50/50">
        <datalist id="tag-list">
          <!-- 已有的标签会通过 JS 动态插入到这里 -->
        </datalist>
      </div>

      <!-- 拖拽/点击上传区 -->
      <div id="dropZone" class="border-2 border-dashed border-gray-300 rounded-xl p-6 text-center hover:border-indigo-400 transition-colors cursor-pointer relative bg-gray-50/50">
        <input type="file" id="fileInput" multiple class="hidden">
        <svg class="mx-auto h-10 w-10 text-gray-400 mb-2" stroke="currentColor" fill="none" viewBox="0 0 48 48"><path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <p class="text-sm text-gray-600">点击或拖拽文件到此处</p>
        <p class="text-xs text-gray-400 mt-1">支持 PDF, Word, TXT</p>
      </div>

      <!-- 文件列表 -->
      <div id="fileList" class="mt-4 space-y-2 hidden"></div>
    </div>

    <!-- 上传按钮 -->
    <div class="p-4 border-t border-gray-100 bg-gray-50/50">
      <button id="uploadBtn" class="w-full flex justify-center py-2.5 px-4 rounded-xl shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 transition-all">
        <span id="btnText">上传并解析</span>
      </button>
    </div>
  </div>

  <!-- ================= 右侧：对话主界面 ================= -->
  <div class="flex-1 bg-white rounded-2xl shadow-xl flex flex-col overflow-hidden border border-gray-100">
    <header class="px-6 py-4 border-b border-gray-100 flex items-center justify-between bg-white/80 backdrop-blur-sm">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center shadow-sm">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
        </div>
        <h1 class="text-lg font-semibold text-gray-800">Ollama 对话</h1>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-xs px-2.5 py-1 rounded-full bg-gray-100 text-gray-600 font-mono border border-gray-200">deepseek-r1:1.5b</span>
        <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
      </div>
    </header>

    <main id="chatContainer" class="flex-1 overflow-y-auto p-5 space-y-4 chat-scroll bg-gray-50/30">
      <div id="messages" class="space-y-4">
        <div class="flex items-start gap-3">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 text-sm font-medium">AI</div>
          <div class="bg-white rounded-2xl rounded-tl-sm px-4 py-3 shadow-sm border border-gray-100 max-w-[85%]">
            <p class="text-gray-700 text-sm leading-relaxed">你好！我是 Ollama 助手。你可以先在左侧上传知识库，然后向我提问。</p>
          </div>
        </div>
      </div>
    </main>

    <footer class="p-4 border-t border-gray-100 bg-white">
      <div class="flex items-end gap-2">
        <textarea id="messageInput" rows="1" placeholder="输入消息..." class="flex-1 resize-none rounded-xl border border-gray-200 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-400 bg-gray-50/50" style="min-height: 48px; max-height: 120px;"></textarea>
        <button id="sendBtn" class="flex-shrink-0 h-12 w-12 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white shadow-md flex items-center justify-center disabled:opacity-50 transition-all">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" /></svg>
        </button>
      </div>
    </footer>
  </div>
</div>

<!-- ================= 1. 原生 JS：处理知识库上传 ================= -->
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const tagInput = document.getElementById('tagInput');
    const tagList = document.getElementById('tag-list');
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileListDiv = document.getElementById('fileList');
    const uploadBtn = document.getElementById('uploadBtn');
    const btnText = document.getElementById('btnText');

    let filesToUpload = [];

    // 1. 加载已有标签
    fetch('/api/v1/rag/query_rag_tag_list')
            .then(res => res.json())
            .then(res => {
              if (res.code === '0000' && res.data) {
                res.data.forEach(tag => {
                  const option = document.createElement('option');
                  option.value = tag;
                  tagList.appendChild(option);
                });
              }
            }).catch(err => console.error('加载标签失败', err));

    // 2. 拖拽与点击事件
    dropZone.addEventListener('click', () => fileInput.click());

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('border-indigo-400', 'bg-indigo-50/50');
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('border-indigo-400', 'bg-indigo-50/50');
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('border-indigo-400', 'bg-indigo-50/50');
      handleFiles(e.dataTransfer.files);
    });

    fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

    // 3. 处理文件列表渲染
    function handleFiles(files) {
      filesToUpload = [...filesToUpload, ...Array.from(files)];
      renderFileList();
    }

    function removeFile(index) {
      filesToUpload.splice(index, 1);
      renderFileList();
    }

    function renderFileList() {
      fileListDiv.innerHTML = '';
      if (filesToUpload.length === 0) {
        fileListDiv.classList.add('hidden');
        return;
      }
      fileListDiv.classList.remove('hidden');

      filesToUpload.forEach((file, index) => {
        const item = document.createElement('div');
        item.className = 'flex items-center justify-between bg-white border border-gray-100 rounded-lg p-2 text-sm';
        item.innerHTML = `
          <span class="truncate max-w-[180px] text-gray-700" title="${file.name}">${file.name}</span>
          <button type="button" class="text-red-400 hover:text-red-600" onclick="removeFile(${index})">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
        `;
        fileListDiv.appendChild(item);
      });
    }
    // 暴露到全局供 onclick 调用
    window.removeFile = removeFile;

    // 4. 点击上传
    uploadBtn.addEventListener('click', async () => {
      const currentTag = tagInput.value.trim();
      if (!currentTag) {
        alert('请先输入知识库标签！');
        return;
      }
      if (filesToUpload.length === 0) {
        alert('请先选择要上传的文件！');
        return;
      }

      // 改变按钮状态
      btnText.textContent = '解析入库中...';
      uploadBtn.disabled = true;
      uploadBtn.classList.add('opacity-70', 'cursor-not-allowed');

      const formData = new FormData();
      formData.append('ragTag', currentTag);
      filesToUpload.forEach(file => formData.append('file', file));

      try {
        const res = await fetch('/api/v1/rag/file/upload', {
          method: 'POST',
          body: formData
        }).then(r => r.json());

        if (res.code === '0000') {
          alert('✅ 上传并解析成功！');
          filesToUpload = [];
          renderFileList();
          // 刷新下拉列表
          if (!Array.from(tagList.options).some(opt => opt.value === currentTag)) {
            const option = document.createElement('option');
            option.value = currentTag;
            tagList.appendChild(option);
          }
        } else {
          alert('❌ 上传失败: ' + (res.info || '未知错误'));
        }
      } catch (err) {
        console.error(err);
        alert('❌ 网络请求失败，请查看后端控制台。');
      } finally {
        btnText.textContent = '上传并解析';
        uploadBtn.disabled = false;
        uploadBtn.classList.remove('opacity-70', 'cursor-not-allowed');
      }
    });
  });
</script>

<!-- ================= 2. 原生 JS：处理流式对话 ================= -->
<script>
  (function() {
    const OLLAMA_API = 'http://117.72.123.254:11434/api/chat';
    const MODEL = 'deepseek-r1:1.5b';

    const chatContainer = document.getElementById('chatContainer');
    const messagesDiv = document.getElementById('messages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');

    let isGenerating = false;
    let currentAiContentDiv = null;

    function scrollToBottom() { chatContainer.scrollTop = chatContainer.scrollHeight; }

    function adjustTextareaHeight() {
      messageInput.style.height = 'auto';
      messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
    }
    messageInput.addEventListener('input', adjustTextareaHeight);

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function addUserMessage(text) {
      const wrapper = document.createElement('div');
      wrapper.className = 'flex items-start gap-3 justify-end';
      wrapper.innerHTML = `
        <div class="bg-gradient-to-br from-blue-500 to-indigo-600 rounded-2xl rounded-tr-sm px-4 py-3 shadow-sm max-w-[85%]">
            <p class="text-white text-sm leading-relaxed whitespace-pre-wrap">${escapeHtml(text)}</p>
        </div>
        <div class="flex-shrink-0 w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center text-gray-600 text-sm font-medium">你</div>
      `;
      messagesDiv.appendChild(wrapper);
      scrollToBottom();
    }

    function addAiPlaceholder() {
      const wrapper = document.createElement('div');
      wrapper.className = 'flex items-start gap-3';
      wrapper.innerHTML = `
        <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 text-sm font-medium">AI</div>
        <div class="bg-white rounded-2xl rounded-tl-sm px-4 py-3 shadow-sm border border-gray-100 max-w-[85%] w-full">
            <div class="text-gray-700 text-sm leading-relaxed whitespace-pre-wrap min-h-[1.5rem] streaming-cursor"></div>
        </div>
      `;
      messagesDiv.appendChild(wrapper);
      scrollToBottom();
      return wrapper.querySelector('.text-gray-700');
    }

    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text || isGenerating) return;

      messageInput.value = '';
      adjustTextareaHeight();
      addUserMessage(text);

      currentAiContentDiv = addAiPlaceholder();
      isGenerating = true;
      sendBtn.disabled = true;
      messageInput.disabled = true;

      let accumulatedContent = '';

      try {
        const response = await fetch(OLLAMA_API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: MODEL,
            messages: [{ role: 'user', content: text }],
            stream: true
          })
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder('utf-8');

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split('\n').filter(line => line.trim() !== '');

          for (const line of lines) {
            try {
              const parsed = JSON.parse(line);
              if (parsed.message && parsed.message.content) {
                accumulatedContent += parsed.message.content;
                currentAiContentDiv.textContent = accumulatedContent;
                scrollToBottom();
              }
              if (parsed.done) {
                finishStream();
                return;
              }
            } catch (e) {
              console.warn('解析 JSON 失败:', line);
            }
          }
        }
      } catch (error) {
        console.error('请求失败:', error);
        currentAiContentDiv.textContent = '⚠️ 连接 Ollama 失败，请检查服务是否可用。';
        finishStream();
      }
    }

    function finishStream() {
      isGenerating = false;
      sendBtn.disabled = false;
      messageInput.disabled = false;
      if (currentAiContentEl) { // 修复这里可能存在的变量名未定义问题
        currentAiContentDiv.classList.remove('streaming-cursor');
      }
      messageInput.focus();
      scrollToBottom();
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (!isGenerating) sendMessage();
      }
    });

    adjustTextareaHeight();
    messageInput.focus();
  })();
</script>
</body>
</html>
